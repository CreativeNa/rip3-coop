; RIP 3 display settings (rip3video.dll)
[Video]
; borderless = borderless window covering the monitor (no display mode change)
; window     = normal window, 1024x768 x WindowScale
Mode=borderless
; upscaling filter:
; fsr      = Catmull-Rom upscale + AMD RCAS sharpening (FSR 1 style)
; sharp    = crisp "pixel" look without shimmering
; bilinear = plain soft stretch (the old way)
Upscale=fsr
; RCAS sharpness for Upscale=fsr: 0 = strongest, 2 = weakest
Sharpness=0.2
; fit     = keep 4:3, black bars on the sides
; stretch = fill the whole screen
; integer = sharp, whole-number scale (x2 on 4K), black frame around
Scale=stretch
; 0 = off (recommended: Windows composes the window without tearing, the
;     game's FpsLimit keeps the pace); 1 = on, makes loading screens much slower
VSync=0
; size multiplier for Mode=window
WindowScale=1
; 1 = skip the Meridian4 and Elephant Games logos at start
SkipLogos=1
; frame limit: 60 = like the original, 0 = the game's own limit
; (game speed does not depend on FPS)
FpsLimit=60
Profile=0
; 1 = read data.pak into memory once: much faster loading
FastLoad=1
